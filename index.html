<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📚 IA Exercises Repository — Índice de documentos</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --tag: #1f6feb33;
    --tag-border: #1f6feb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem 1rem;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 2.5rem; }
  header h1 { font-size: 2rem; margin-bottom: .5rem; }
  header p { color: var(--muted); font-size: .95rem; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { color: var(--accent-hover); text-decoration: underline; }

  .search-box {
    display: flex; gap: .5rem; margin: 2rem 0;
    max-width: 600px; margin-left: auto; margin-right: auto;
  }
  .search-box input {
    flex: 1; padding: .75rem 1rem;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 1rem;
  }
  .search-box input:focus { outline: 2px solid var(--accent); }

  .stats {
    display: flex; gap: 1rem; justify-content: center;
    color: var(--muted); font-size: .9rem; margin-bottom: 2rem;
  }

  .area {
    margin-bottom: 2.5rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    overflow: hidden;
  }
  .area-header {
    padding: 1rem 1.25rem;
    background: #1c2128;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: .75rem;
    cursor: pointer;
    user-select: none;
  }
  .area-header h2 { font-size: 1.1rem; font-weight: 600; flex: 1; }
  .area-header .count {
    background: var(--tag); color: var(--accent);
    padding: .15rem .6rem; border-radius: 999px; font-size: .8rem;
    border: 1px solid var(--tag-border);
  }
  .area-header .chevron { transition: transform .2s; color: var(--muted); }
  .area.collapsed .chevron { transform: rotate(-90deg); }
  .area.collapsed .area-body { display: none; }

  .doc {
    display: flex; gap: 1rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
    transition: background .15s;
  }
  .doc:last-child { border-bottom: none; }
  .doc:hover { background: #1c2128; }
  .doc .icon { font-size: 1.5rem; flex-shrink: 0; }
  .doc .info { flex: 1; min-width: 0; }
  .doc .info h3 {
    font-size: 1rem; font-weight: 600; margin-bottom: .25rem;
  }
  .doc .info h3 a { color: var(--accent); text-decoration: none; }
  .doc .info h3 a:hover { text-decoration: underline; color: var(--accent-hover); }
  .doc .info p { color: var(--muted); font-size: .875rem; }
  .doc .info .meta {
    display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem;
    font-size: .75rem; color: var(--muted);
  }
  .doc .info .meta span {
    padding: .1rem .5rem; border-radius: 4px;
    background: #21262d; border: 1px solid var(--border);
  }
  .doc .actions { display: flex; gap: .5rem; flex-shrink: 0; }
  .doc .actions a {
    padding: .4rem .8rem; font-size: .8rem; border-radius: 6px;
    text-decoration: none; transition: all .15s; white-space: nowrap;
  }
  .btn-view { background: var(--accent); color: #0d1117; font-weight: 600; }
  .btn-view:hover { background: var(--accent-hover); }
  .btn-raw {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
  }
  .btn-raw:hover { color: var(--text); border-color: var(--muted); }

  .empty {
    text-align: center; color: var(--muted);
    padding: 3rem 1rem; font-style: italic;
  }

  footer {
    text-align: center; color: var(--muted);
    font-size: .85rem; margin-top: 3rem; padding-top: 2rem;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .doc { flex-wrap: wrap; }
    .doc .actions { width: 100%; justify-content: flex-end; margin-top: .5rem; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>🧠 IA Exercises Repository</h1>
    <p>Índice de documentos académicos y ejercicios de Inteligencia Artificial</p>
    <p><a href="https://github.com/jcteacher-lab/IA_Excersices_repository" target="_blank">Ver repositorio en GitHub ↗</a></p>
  </header>

  <div class="search-box">
    <input id="search" type="search" placeholder="🔍 Buscar por título, área o etiqueta..." />
  </div>

  <div class="stats">
    <span id="total-docs">0 documentos</span>
    <span>·</span>
    <span id="total-areas">0 áreas</span>
  </div>

  <main id="content"></main>

  <footer>
    <p>Última actualización: <span id="last-update">—</span></p>
    <p>Hecho con ❤️ para la comunidad de IA · <a href="https://github.com/jcteacher-lab/IA_Excersices_repository" target="_blank">Contribuir en GitHub</a></p>
  </footer>

</div>

<script>
/* ============================================================
   📝 AQUÍ SE AÑADEN LOS DOCUMENTOS
   Para agregar uno nuevo, copia un bloque y modifícalo.
   ============================================================ */
const documents = [
  {
    area: "PLN — Procesamiento de Lenguaje Natural",
    icon: "💬",
    title: "Expresiones regulares en Python",
    description: "Ejercicios y material de estudio sobre el uso de expresiones regulares (regex) aplicadas en Python.",
    tags: ["Python", "Regex", "PLN"],
    path: "PLN/Regrex/Expresiones regulares en Python.pdf",
    type: "PDF"
  }
  /* 👇 Añade más documentos así:
  {
    area: "Deep Learning",
    icon: "🧠",
    title: "Redes neuronales convolucionales — ejercicios",
    description: "Ejercicios resueltos sobre CNN.",
    tags: ["CNN", "PyTorch"],
    path: "DeepLearning/CNN/ejercicios_cnn.pdf",
    type: "PDF"
  },
  */
];

const REPO = "jcteacher-lab/IA_Excersices_repository";
const REPO_URL = `https://github.com/${REPO}`;
const BLOB_URL = `${REPO_URL}/blob/main/`;

/* ============ Renderizado (no tocar salvo que quieras cambiar el diseño) ============ */
function iconFor(type) {
  return type === "PDF" ? "📄"
       : type === "IPYNB" ? "📓"
       : type === "MD" ? "📝"
       : type === "ZIP" ? "📦"
       : "📁";
}

function render(filter = "") {
  const q = filter.trim().toLowerCase();
  const filtered = documents.filter(d =>
    !q ||
    d.title.toLowerCase().includes(q) ||
    d.area.toLowerCase().includes(q) ||
    d.description.toLowerCase().includes(q) ||
    d.tags.some(t => t.toLowerCase().includes(q))
  );

  const grouped = filtered.reduce((acc, d) => {
    (acc[d.area] = acc[d.area] || []).push(d);
    return acc;
  }, {});

  const content = document.getElementById("content");
  content.innerHTML = "";

  if (!Object.keys(grouped).length) {
    content.innerHTML = `<div class="empty">No se encontraron documentos para "<strong>${filter}</strong>"</div>`;
  }

  for (const [area, docs] of Object.entries(grouped)) {
    const areaEl = document.createElement("section");
    areaEl.className = "area";
    areaEl.innerHTML = `
      <div class="area-header">
        <span class="chevron">▼</span>
        <h2>${docs[0].icon} ${area}</h2>
        <span class="count">${docs.length} doc${docs.length > 1 ? "s" : ""}</span>
      </div>
      <div class="area-body">
        ${docs.map(d => {
          const url = BLOB_URL + encodeURI(d.path);
          return `
          <div class="doc">
            <div class="icon">${iconFor(d.type)}</div>
            <div class="info">
              <h3><a href="${url}" target="_blank" rel="noopener">${d.title}</a></h3>
              <p>${d.description}</p>
              <div class="meta">
                ${d.tags.map(t => `<span>${t}</span>`).join("")}
                <span>${d.type}</span>
              </div>
            </div>
            <div class="actions">
              <a class="btn-view" href="${url}" target="_blank" rel="noopener">Abrir →</a>
              <a class="btn-raw" href="${url.replace('/blob/', '/raw/')}" target="_blank" rel="noopener" download>Descargar</a>
            </div>
          </div>`;
        }).join("")}
      </div>
    `;
    areaEl.querySelector(".area-header").addEventListener("click", () => {
      areaEl.classList.toggle("collapsed");
    });
    content.appendChild(areaEl);
  }

  document.getElementById("total-docs").textContent = `${documents.length} documento${documents.length !== 1 ? "s" : ""}`;
  document.getElementById("total-areas").textContent = `${new Set(documents.map(d => d.area)).size} área${new Set(documents.map(d => d.area)).size !== 1 ? "s" : ""}`;
}

document.getElementById("search").addEventListener("input", e => render(e.target.value));
document.getElementById("last-update").textContent = new Date().toLocaleDateString("es-MX", {
  year: "numeric", month: "long", day: "numeric"
});
render();
</script>
</body>
</html>
